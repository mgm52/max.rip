<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Mcguinness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { 
                clip-path: inset(0 0 0 0);
            }
            to { 
                clip-path: inset(100% 0 0 0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        body {
            font-family: "Courier New", monospace;
            line-height: 1.4;
            color: #00ff00;
            background-color: #000000;
            padding: 4rem;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #000000;
            z-index: 9999;
            animation: slideDown 4s ease-out forwards;
            pointer-events: none;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.1;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4rem;
            max-width: 500px; /* Limit the width */
            margin: 0 auto; /* Center the section horizontally */
            position: relative;
            z-index: 1;
        }


        .left-column {
            position: sticky;
            top: 2rem;
            height: fit-content;
        }

        .profile-container {
            margin-bottom: 3rem;
            position: relative;
            border: 1px solid #00ff00;
            padding: 1rem;
            max-width: 466px;
        }

        .profile-container::before {
            content: '[ME] [THATS ME]';
            position: absolute;
            top: -0.8em;
            left: 1rem;
            background: #000;
            padding: 0 0.5rem;
            color: #00ff00;
            font-size: 0.8rem;
        }

        .profile-image {
            width: 200px;
            height: 280px;
            border: 1px solid #00ff00;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /*filter: saturate(0);*/
        }

        .profile-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .bio { /* Styles for <p class="bio"> */
            color: #00cc00;
            max-width: 80%; /* On desktop, relative to .profile-container */
            margin-bottom: 0.5rem; /* Space between bio paragraphs */
            /* Text alignment will be handled by parent or specific rules */
        }

        .terminal {
            height: 11.5em; /* Fixed viewport: old lines push up and out of view */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }

        .bio.term-input-text {
            word-break: break-all; /* Long typed input wraps instead of overflowing */
        }


        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #00ff00;
            margin-bottom: 1rem;
        }

        .section-title::before {
            content: '>';
            margin-right: 0.5rem;
        }

        .project {
            border: 1px solid #00ff00;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .project:hover {
            background: #00ff0011;
            transform: translateX(5px);
        }

        .project h3 {
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .contact a {
            color: #00ff00;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
        }

        .contact a:hover {
            /*text-shadow: 0 0 10px #00ff00;*/
        }

        .contact a::before {
            content: '[';
            margin-right: 0.2rem;
        }

        .contact a::after {
            content: ']';
            margin-left: 0.2rem;
        }

        /* General link styles - these are fine */
        a:link {
        color: #44ff44;
        background-color: transparent;
        text-decoration: underline;
        }

        a:visited {
        color: #44ff44;
        background-color: transparent;
        text-decoration: none;
        }

        a:hover {
        color: red;
        background-color: transparent;
        text-decoration: underline;
        }

        a:active {
        color: white;
        background-color: transparent;
        text-decoration: underline;
        }

        .cursor {
            display: inline-block;
            width: 0.75em; /* Scales with parent font-size */
            height: 0.3em; /* Scales with parent font-size */
            background-color: #004400;
            animation: blink 1s step-end infinite;
            margin-bottom: 0.3em;
            margin-left: 0em;
            vertical-align: bottom; /* This should keep it aligned like an underscore */
        }

        /* --- MOBILE STYLES --- */
        @media (max-width: 768px) {
            body {
                padding: 1rem; /* Reduce body padding */
            }

            .content-wrapper {
                grid-template-columns: 1fr; /* Ensures single column */
                gap: 1.5rem; /* Reduce gap */
            }

            .left-column {
                position: relative; /* Remove sticky behavior */
                top: 0;
            }

            .profile-container {
                padding: 1rem; /* Keep padding or adjust as needed */
                margin-bottom: 2rem; /* Adjust margin */
            }
            /* The .profile-container::before label should be fine relative to container */

            .profile-image {
                width: 130px; /* Adjust image size */
                height: 182px; /* Maintain aspect ratio (130 * 280/200) */
                margin-left: auto;   /* Center the image block */
                margin-right: auto;
                margin-bottom: 1rem; /* Space below image */
            }

            h1 {
                font-size: 1.3rem; /* Adjust heading size */
                text-align: center; /* Center heading */
            }

            .bio { /* Styles for each <p class="bio"> on mobile */
                max-width: 90%; /* Allow bio paragraphs to be wider relative to container */
                margin-left: auto; /* Center the paragraph block */
                margin-right: auto;
                text-align: left; /* Keep text inside the paragraph left-aligned */
                font-size: 0.95rem; /* Slightly adjust font size for readability */
            }

            .contact {
                flex-direction: column; /* Stack vertically on mobile too */
                align-items: center; /* Center the divs */
                gap: 0.5rem; /* Space between rows */
                margin-top: 1.5rem; /* Space above contact links */
            }
            
            .contact > div {
                flex-wrap: wrap; /* Allow links within each div to wrap if needed */
                justify-content: center; /* Center the links */
                gap: 0.5rem 1rem; /* Spacing between links */
            }

            .contact a {
                font-size: 0.9rem; /* Adjust link font size */
            }

            .rain { /* Optional: for performance/visuals on mobile */
                font-size: 0.9rem; /* Smaller matrix rain characters */
                opacity: 0.07; /* Make it even more subtle */
            }

        }
    </style>
</head>
<body>
    <div class="matrix-bg" id="matrix-bg"></div>
    
    <div class="content-wrapper">
        <div class="left-column">
            <div class="profile-container">
                <div class="profile-image">
                    <img src="IMG_1361.jpg" alt="Max">
                </div>
                <h1>MAX MCGUINNESS</h1>
                <div class="terminal" id="terminal">
                    <p class="bio">> Hello! I'm a UK-based ML engineer. I sometimes make weird <a href="https://wombatty.itch.io/">things</a> like this ugly website.</p>
                    <p class="bio">> In 2023, I completed a CS MEng degree at Cambridge, and now work at Anthropic in London.</p>
                    <p class="bio term-input-text" id="term-prompt">> <span id="term-input"></span><span class="cursor"></span></p>
                </div>
            </div>
            <nav class="contact">
                <div style="display: flex; gap: 2rem;">
                    <a href="https://github.com/mgm52">GITHUB</a>
                    <a href="https://arxiv.org/search/?query=McGuinness%2C+Max&searchtype=author&abstracts=show&order=-announced_date_first">ARXIV</a>
                    <a href="https://wombatty.itch.io/">GAMES</a>
                    <a href="https://linkedin.com/in/max-mcguinness/">LINKEDIN</a>
                </div>
                <div style="display: flex; gap: 2rem; margin-top: 0.5rem;">
                    <a href="mailto:max@max.rip">EMAIL</a>
                    <a href="https://x.com/maxgmcg">TWITTER</a>
                    <a href="https://aol.com">AOL</a>
                    <a href="https://mgm52.github.io">GOBLINS</a>
                </div>
            </nav>
        </div>
    </div>

    <script>
        (function () {
            const terminal = document.getElementById('terminal');
            const promptLine = document.getElementById('term-prompt');
            const inputSpan = document.getElementById('term-input');
            let inputBuffer = '';

            // Fake filesystem: objects are directories, strings are files
            const fsRoot = {
                home: {
                    'goblin_cheats.md': 'mgm52.github.io...\ntry shift clicking R',
                    max: {
                        'README.md': [
                            ' /\\_/\\',
                            '( o.o )',
                            ' > ^ <',
                        ].join('\n'),
                    },
                },
            };

            let cwd = ['home', 'max'];

            // Resolve a path string to {node, segs} or null if it doesn't exist
            function resolve(pathStr) {
                let segs = pathStr.startsWith('/') ? [] : cwd.slice();
                for (const part of pathStr.split('/')) {
                    if (part === '' || part === '.') continue;
                    if (part === '..') { segs.pop(); continue; }
                    segs.push(part);
                }
                let node = fsRoot;
                for (const seg of segs) {
                    if (typeof node !== 'object' || !(seg in node)) return null;
                    node = node[seg];
                }
                return { node: node, segs: segs };
            }

            const commands = {
                pwd: () => '/' + cwd.join('/'),
                cd: (args) => {
                    const target = args.length === 0 ? '/home/max' : args[0];
                    const r = resolve(target);
                    if (!r) return 'cd: ' + target + ': No such file or directory';
                    if (typeof r.node !== 'object') return 'cd: ' + target + ': Not a directory';
                    cwd = r.segs;
                    return '';
                },
                ls: (args) => {
                    const r = resolve(args.length === 0 ? '.' : args[0]);
                    if (!r) return 'ls: ' + args[0] + ': No such file or directory';
                    if (typeof r.node !== 'object') return args[0]; // ls on a file echoes it
                    return Object.keys(r.node)
                        .map(name => typeof r.node[name] === 'object' ? name + '/' : name)
                        .join('  ');
                },
                cat: (args) => {
                    if (args.length === 0) return 'cat: missing operand';
                    return args.map(name => {
                        const r = resolve(name);
                        if (!r) return 'cat: ' + name + ': No such file or directory';
                        if (typeof r.node === 'object') return 'cat: ' + name + ': Is a directory';
                        return r.node;
                    }).join('\n');
                },
                claude: () => {
                    const crab = [
                        '      ████████████████████████      ',
                        '      ████  ████████████  ████      ',
                        '  ████████████████████████████████  ',
                        '      ████████████████████████      ',
                        '        ██  ██        ██  ██        ',
                    ];
                    const heart = [
                        '  ████  ████  ',
                        '██████████████',
                        '  ██████████  ',
                        '    ██████    ',
                        '      ██      ',
                    ];
                    // Double crab rows vertically so pixels come out square;
                    // keep the heart single-height (smaller), centered beside the crab
                    const crabRows = crab.flatMap(r => [r, r]);
                    const heartRows = ['', '', ...heart, '', '', ''];
                    const p = printLine('', '#da7756');
                    p.style.lineHeight = '1'; // solid pixel rows
                    p.style.fontSize = '0.55rem';
                    p.style.maxWidth = 'none';
                    crabRows.forEach((row, i) => {
                        p.appendChild(document.createTextNode(row + '  '));
                        const s = document.createElement('span');
                        s.style.color = '#ff5555';
                        s.textContent = heartRows[i];
                        p.appendChild(s);
                        p.appendChild(document.createTextNode('\n'));
                    });
                    return '';
                },
                echo: (args) => args.join(' ') || ' ',
                duck: () => '<3',
                quack: () => '<3',
                whoami: () => 'max',
                help: () => [
                    'available commands:',
                    '  pwd   ls    cd <dir>',
                    '  cat <file>  echo <text>',
                    '  help  sudo  claude',
                    '  whoami',
                ].join('\n'),
                sudo: () => 'max is not in the sudoers file. This incident will be reported.',
            };

            function printLine(text, color) {
                const p = document.createElement('p');
                p.className = 'bio term-input-text';
                p.style.whiteSpace = 'pre-wrap'; // preserve spacing for ascii art
                if (color) p.style.color = color;
                p.textContent = text;
                terminal.insertBefore(p, promptLine);
                return p;
            }

            function runCommand(raw) {
                // Freeze the typed command as a historical line
                printLine('> ' + raw);
                const cmd = raw.trim();
                if (cmd === '') return;
                const parts = cmd.split(/\s+/);
                const name = parts[0].toLowerCase();
                const args = parts.slice(1);
                if (commands[name]) {
                    const output = commands[name](args);
                    if (output) printLine(output);
                } else {
                    printLine(name + ': command not found');
                }
            }

            document.addEventListener('keydown', function (e) {
                // Don't swallow browser shortcuts or typing in real inputs
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                const tag = document.activeElement && document.activeElement.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;

                if (e.key === 'Enter') {
                    runCommand(inputBuffer);
                    inputBuffer = '';
                } else if (e.key === 'Backspace') {
                    inputBuffer = inputBuffer.slice(0, -1);
                } else if (e.key.length === 1) {
                    inputBuffer += e.key;
                    if (e.key === ' ') e.preventDefault(); // stop page scroll
                } else {
                    return;
                }
                inputSpan.textContent = inputBuffer;
            });
        })();
    </script>

</body>
</html>
